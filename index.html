<script>
  function crearHojasInfinitas() {
      const contenedor = document.getElementById('hojas-contenedor');
      if (!contenedor) return;

      contenedor.innerHTML = ''; // Limpia ejecuciones previas
      const totalHojas = 20; // Cantidad constante de hojas en pantalla

      for (let i = 0; i < totalHojas; i++) {
          const hoja = document.createElement('div');
          hoja.classList.add('hoja-cafe');

          // Distribución horizontal uniforme
          hoja.style.left = Math.random() * 100 + '%';
          
          // Duración y tiempos negativos para que ya haya hojas cayendo desde el segundo 0
          const duracion = Math.random() * 4 + 6; // Entre 6 y 10 segundos
          const retrasoNegativo = -(Math.random() * duracion); // Inicia la animación en curso
          const tamano = Math.random() * 8 + 12;

          hoja.style.animationDuration = duracion + 's';
          hoja.style.animationDelay = retrasoNegativo + 's';
          hoja.style.width = tamano + 'px';
          hoja.style.height = (tamano * 1.5) + 'px';

          contenedor.appendChild(hoja);
      }
  }

  document.addEventListener('DOMContentLoaded', crearHojasInfinitas);
</script>
